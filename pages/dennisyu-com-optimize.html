<style>
  :root{
    --ink:#13203A; --muted:#516079; --faint:#8A97AC;
    --accent:#FF5A1F; --accent2:#1D74E8; --gold:#B7791F; --violet:#7C3AED; --green:#15803D;
    --line:#E4E9F2; --card:#FFFFFF; --bg:#F4F6FB; --soft:#FBFCFE; --dark:#0F1A30;
    --mono:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:
      radial-gradient(1200px 600px at 85% -10%, #EAF1FF 0%, rgba(234,241,255,0) 60%),
      radial-gradient(1000px 500px at -10% 110%, #FFF0E8 0%, rgba(255,240,232,0) 55%),
      var(--bg);
    color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:clamp(20px,3.2vw,44px) clamp(18px,3vw,40px) 40px}

  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:clamp(12px,1.2vw,15px);color:var(--muted);text-transform:uppercase;flex-wrap:wrap}
  .brand .b{width:13px;height:13px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--gold))}
  .brand .step{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--violet);padding:5px 10px;border-radius:999px}

  h1{font-size:clamp(30px,4.6vw,60px);line-height:1.02;letter-spacing:-.03em;margin:clamp(12px,2vw,22px) 0 10px;font-weight:800}
  h1 .g{background:linear-gradient(92deg,var(--accent2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:clamp(15px,1.55vw,21px);max-width:860px}

  .hero{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:clamp(20px,3vw,40px);align-items:stretch;margin-top:clamp(18px,2.6vw,30px)}
  @media(max-width:820px){.hero{grid-template-columns:1fr}}

  .qrcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,2vw,24px);text-align:center;box-shadow:0 18px 50px rgba(19,32,58,.08);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .qrcard .lab{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:12px}
  .qrcard .qr{width:clamp(190px,22vw,290px);height:clamp(190px,22vw,290px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
  .qrcard .qr img{width:100%;height:100%;display:block;image-rendering:pixelated}
  .qrcard .url{font-family:var(--mono);font-weight:800;font-size:clamp(16px,1.7vw,22px);color:var(--ink);margin-top:14px}
  .qrcard .url .slash{color:var(--accent)}
  .qrcard .hint{font-size:13px;color:var(--faint);margin-top:6px}

  .steps{display:flex;flex-direction:column;gap:12px;justify-content:center}
  .stepc{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.6vw,20px) clamp(16px,1.8vw,24px)}
  .stepc .num{flex:none;width:clamp(40px,3.4vw,52px);height:clamp(40px,3.4vw,52px);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:clamp(18px,1.9vw,24px);color:#fff;background:linear-gradient(135deg,var(--accent),var(--gold))}
  .stepc h3{font-size:clamp(17px,1.8vw,24px);letter-spacing:-.01em;line-height:1.1}
  .stepc p{font-size:clamp(13.5px,1.35vw,17px);color:var(--muted);margin-top:3px}
  .stepc .k{font-family:var(--mono);font-weight:700;color:var(--accent2)}

  .promptwrap{margin-top:clamp(22px,3vw,34px)}
  .promptwrap .ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .promptwrap .ph h2{font-size:clamp(17px,1.8vw,23px);letter-spacing:-.01em}
  .promptwrap .ph .tag{font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--green);padding:4px 9px;border-radius:999px;text-transform:uppercase}
  .copybtn{margin-left:auto;border:none;cursor:pointer;font:inherit;font-weight:800;font-size:clamp(14px,1.4vw,17px);color:#fff;background:var(--ink);padding:11px 20px;border-radius:12px;box-shadow:0 8px 20px rgba(19,32,58,.18);transition:.15s}
  .copybtn:hover{background:var(--accent);transform:translateY(-1px)}
  .copybtn.done{background:var(--green)}
  .promptbox{position:relative;background:var(--dark);border:1px solid #24344f;border-radius:16px;padding:clamp(16px,1.8vw,24px);box-shadow:0 18px 50px rgba(15,26,48,.22)}
  pre.prompt{font-family:var(--mono);font-size:clamp(12px,1.12vw,14.5px);line-height:1.62;color:#DCE7F7;white-space:pre-wrap;word-break:break-word;margin:0;max-height:none}
  pre.prompt .h{color:#FBBF8A;font-weight:700}
  pre.prompt b{color:#9FD0FF;font-weight:700}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  @media(max-width:760px){.row2{grid-template-columns:1fr}}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px}
  .mini h4{font-size:14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .mini h4 .dot{width:9px;height:9px;border-radius:3px}
  .mini p{font-size:13.5px;color:var(--muted)}
  .mini .cmd{display:block;font-family:var(--mono);font-size:13px;color:var(--ink);background:#EEF2F9;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:7px}
  .mini .cmd:first-of-type{margin-top:9px}

  .sect{margin-top:clamp(30px,4vw,52px)}
  .sect .kick{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2)}
  .sect h2{font-size:clamp(22px,2.8vw,36px);letter-spacing:-.02em;line-height:1.08;margin:6px 0 8px}
  .sect .lead{color:var(--muted);font-size:clamp(14px,1.45vw,18px);max-width:860px}

  .bigcard{display:grid;grid-template-columns:1fr auto;gap:clamp(16px,2.4vw,34px);align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,2.4vw,30px);box-shadow:0 18px 50px rgba(19,32,58,.08);margin-top:16px}
  @media(max-width:760px){.bigcard{grid-template-columns:1fr}}
  .bigcard h3{font-size:clamp(18px,2vw,26px);letter-spacing:-.015em}
  .bigcard p{color:var(--muted);font-size:clamp(13.5px,1.35vw,16.5px);margin-top:6px}
  .bigcard ul{margin:10px 0 0 18px;color:var(--muted);font-size:clamp(13px,1.3vw,15.5px)}
  .bigcard ul li{margin:4px 0}
  .btn{display:inline-block;text-decoration:none;font-weight:800;font-size:clamp(14px,1.4vw,17px);color:#fff;background:var(--green);padding:13px 22px;border-radius:12px;box-shadow:0 10px 24px rgba(21,128,61,.28);transition:.15s}
  .btn:hover{transform:translateY(-1px);background:#116232}
  .btn.blue{background:var(--accent2);box-shadow:0 10px 24px rgba(29,116,232,.28)}
  .btn.blue:hover{background:#1257b4}
  .btnstack{display:flex;flex-direction:column;gap:10px;align-items:center}
  .btnnote{font-size:12px;color:var(--faint);text-align:center;max-width:240px}

  .tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
  @media(max-width:860px){.tiers{grid-template-columns:repeat(2,1fr)}}
  .tier{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .tier .tt{font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .tier p{font-size:13px;color:var(--muted);margin-top:5px}

  .badge{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-top:14px;font-size:13.5px;color:var(--muted)}
  .badge b{color:var(--ink)}

  .foot{margin-top:34px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--faint)}
  .foot b{color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;box-shadow:0 12px 30px rgba(21,128,61,.35);opacity:0;pointer-events:none;transition:.25s;font-size:15px;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  @media(max-width:860px){.trio{grid-template-columns:1fr}}
</style>
